import {ensureRouter} from './Engine/boot-router.js?v=02408r35';await ensureRouter();const {createRoundPresentation}=await import('./Engine/round-presentation.js?v=02408r35');let tick=0,last,chainAt=null;const presentation=createRoundPresentation({tick:()=>tick,characters:()=>['SailorJupiter','SailorVenus']});await presentation.ready;const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');for(const text of ['Round 1','FIGHT','K.O.','Double K.O.','Time Over','Draw','P1 Wins','P2 Wins']){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{chainAt=null;presentation.message('');presentation.message(text)};document.querySelector('#buttons').append(b)}document.querySelector('#chain').onclick=()=>{presentation.message('');presentation.message('Round 1');chainAt=tick+70};presentation.message('Round 1');function frame(now){if(last!==undefined)tick+=(now-last)*60/1000;last=now;if(chainAt!==null&&tick>=chainAt){presentation.message('FIGHT');chainAt=null}ctx.fillStyle='#171b31';ctx.fillRect(0,0,1280,720);presentation.draw(ctx);const s=presentation.snapshot();document.querySelector('#status').textContent=s.message+' · '+Math.floor(s.age)+' ticks';requestAnimationFrame(frame)}requestAnimationFrame(frame);window.roundReview={presentation,ctx,setTick:value=>tick=value};
