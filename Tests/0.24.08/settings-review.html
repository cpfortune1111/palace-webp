import {ensureRouter} from './Engine/boot-router.js?v=02408r38';await ensureRouter();const {createSettingsPresentation}=await import('./Engine/settings-presentation.js?v=02408r43'),{assetUrl}=await import('./Engine/asset-paths.js?v=02362');const animation=createSettingsPresentation(),background=new Image();await Promise.all([animation.ready,new Promise((resolve,reject)=>{background.onload=resolve;background.onerror=reject;background.src=assetUrl('./system-webp/system-200-1.webp')})]);const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#tick');let playing=true,tick=0,last;animation.begin();const draw=()=>{animation.seek(tick);ctx.fillStyle='#05050d';ctx.fillRect(0,0,1280,720);animation.draw(ctx,{image:background});slider.value=tick;document.querySelector('#status').textContent=Math.floor(tick)+'T';};document.querySelector('#replay').onclick=()=>{tick=0;playing=true;document.querySelector('#pause').textContent='Pause'};document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'Pause':'Resume'};slider.oninput=()=>{tick=Number(slider.value);playing=false;document.querySelector('#pause').textContent='Resume';draw()};function frame(now){if(last!==undefined&&playing)tick=Math.min(212,tick+Math.min(.05,(now-last)/1000)*60);last=now;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);window.settingsReview={animation,show(t){playing=false;tick=t;draw()}};
