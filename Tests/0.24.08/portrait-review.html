<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Palace · 大頭像動畫校對</title>
<style>body{margin:0;background:#fff;color:#60497a;font:16px Arial,sans-serif}header{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 12px 0 0}select,button{font:inherit;padding:8px;border:1px solid #c898d8;background:#fff;border-radius:8px;color:inherit}button{cursor:pointer}main{max-width:1280px;margin:auto}canvas{display:block;width:100%;height:auto;background:#f3eaff}p{padding:0 20px;line-height:1.6}#status{margin-left:auto}</style>
<header><h1>大頭像動畫校對</h1><select id="character" aria-label="角色"><option value="SailorMoon">Moon</option><option value="SailorJupiter">Jupiter</option><option value="SailorNeptune">Neptune</option><option value="SailorSaturn">Saturn</option><option value="SailorVenus">Venus</option></select><select id="action" aria-label="動畫"></select><button id="play">重新播放</button><label><input id="mirror" type="checkbox">P2 鏡像</label><span id="status">準備中…</span></header>
<main><canvas id="canvas" width="1280" height="720"></canvas></main><p>選擇角色及動畫便可播放。Moon 敗北會循環喊，唔做對口；Moon／Jupiter 勝利會先轉 Pose，再開始講話。</p>
<script type="module">
const status=document.querySelector('#status'),character=document.querySelector('#character'),action=document.querySelector('#action'),button=document.querySelector('#play'),canvas=document.querySelector('canvas'),context=canvas.getContext('2d');
try{const workerURL=new URL('./snapshot-worker.js?v=02408r9',location.href).href;await navigator.serviceWorker.register(workerURL,{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;if(navigator.serviceWorker.controller?.scriptURL!==workerURL)await new Promise(resolve=>{const changed=()=>{if(navigator.serviceWorker.controller?.scriptURL===workerURL){navigator.serviceWorker.removeEventListener('controllerchange',changed);resolve()}};navigator.serviceWorker.addEventListener('controllerchange',changed);changed()});
 const{createQuotePortrait}=await import('./Engine/quote-animation.js?v=02408r9'),portrait=createQuotePortrait(character.value);let playing=false,last,serial=0;
 const labels={'9000':'選角待機','9010':'決戰準備','9011':'決戰宣言 1','9012':'決戰宣言 2','9019':'勝敗準備','9020':'勝利宣言 1','9021':'勝利宣言 2','9030':'KO 敗北 1','9031':'KO 敗北 2','9040':'Time Over 敗北 1','9041':'Time Over 敗北 2'};
 async function selectCharacter(){const request=++serial;playing=false;portrait.stop();status.textContent='準備中…';await portrait.select(character.value);if(request!==serial)return;action.replaceChildren();for(const id of Object.keys(portrait.manifest.actions)){const o=document.createElement('option');o.value=id;o.textContent=labels[id]||id;action.append(o)}await play()}
 async function play(){const request=++serial;playing=false;portrait.stop();status.textContent='準備中…';await portrait.prepare([action.value||'9000']);if(request!==serial)return;portrait.set(action.value||'9000');last=undefined;playing=true;status.textContent='播放中'}
 character.onchange=()=>selectCharacter().catch(fail);action.onchange=()=>play().catch(fail);button.onclick=()=>play().catch(fail);
 function fail(error){playing=false;status.textContent='無法載入：'+error.message}
 function animate(now){if(playing){const amount=last===undefined?0:Math.min(.05,(now-last)/1000)*60;portrait.step(amount,audio=>audio);last=now}context.clearRect(0,0,1280,720);portrait.draw(context,0,0,1280,720,1,document.querySelector('#mirror').checked?-1:1);requestAnimationFrame(animate)}requestAnimationFrame(animate);await selectCharacter();
}catch(error){status.textContent='無法開啟：'+error.message}
</script></html>
