<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Palace 0.24.08 test</title>
<style>body{margin:0;background:white;color:#333;font:18px Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}p{max-width:32em;padding:20px}</style>
<p id="status">Opening Moon Palace 0.24.08…</p>
<script type="module">
try{
 if(!('serviceWorker' in navigator))throw Error('This browser does not support the test page asset router.');
 await navigator.serviceWorker.register('./snapshot-worker.js',{scope:'./',updateViaCache:'none'});
 await navigator.serviceWorker.ready;
 if(!navigator.serviceWorker.controller)await new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}));
 const target=new URL('./game.html',location.href);target.search=location.search;target.searchParams.set('revision','02408r2');target.hash=location.hash;location.replace(target);
}catch(error){document.getElementById('status').textContent='Unable to open the test page. '+error.message}
</script></html>
