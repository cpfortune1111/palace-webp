<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Palace · Declaration preview</title>
<style>body{margin:0;background:#211742;color:#fff;font:16px Arial,sans-serif}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px}select,button,input{font:inherit}button,select{padding:7px}canvas{display:block;width:min(100%,1280px);height:auto;margin:auto;background:#15152c}#tick{width:min(50vw,650px)}p{padding:0 12px}a{color:#ffb8e4}</style>
<header><a href="./portrait-review.html?v=saturnQuote1">Portrait preview</a><label>P1 <select id="p1"></select></label><label>P2 <select id="p2"></select></label><select id="mode"><option value="vs">VS declaration</option><option value="result">Win / Loss declaration</option></select><label>Winner <select id="winner"><option value="1">P1</option><option value="2">P2</option><option value="0">Draw</option></select></label><button id="replay">Replay</button><button id="play">Pause</button><label><input id="mute" type="checkbox" checked>Mute</label><label>Tick <input id="tick" type="range" min="0" max="1500" value="0"></label><output id="status">Loading…</output></header><canvas width="1280" height="720"></canvas><p>Drag Tick to inspect an exact frame. Result declarations start 60px lower; the winner rises and the loser moves down. Saturn stays behind a different opponent only during VS declarations.</p>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import {ensureRouter} from './Engine/boot-router.js?v=saturnQuote1';await ensureRouter();
import {installAssetInteractions} from './Engine/asset-interactions.js?v=uiPolish1';installAssetInteractions();
const {createDeclarationScreen}=await import('./Engine/declaration-screen.js?v=saturnQuote1');
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#tick'),status=document.querySelector('#status'),p1=document.querySelector('#p1'),p2=document.querySelector('#p2'),mode=document.querySelector('#mode'),winner=document.querySelector('#winner'),play=document.querySelector('#play');
for(const select of [p1,p2])for(const name of ['Moon','Jupiter','Venus','Neptune','Saturn']){const option=document.createElement('option');option.value='Sailor'+name;option.textContent=name;select.append(option)}p1.value='SailorSaturn';p2.value='SailorVenus';
let playing=false,seeking=false,variants,tick=0,last,accumulator=0,serial=0;
const silent=()=>({paused:true,ended:true,currentTime:0,play:()=>Promise.resolve(),pause(){}});
const declaration=createDeclarationScreen({sound:audio=>seeking||document.querySelector('#mute').checked?silent():audio,complete:()=>{playing=false;play.textContent='Play'}});
const background=new Image();background.src='./Stage/Select/background.webp?v=saturnQuote1';await Promise.all([declaration.ready,background.decode()]);
function options(){return {result:mode.value==='result',winner:Number(winner.value),variants}}
function draw(){ctx.clearRect(0,0,1280,720);ctx.drawImage(background,0,0,1280,720);declaration.draw(ctx);slider.value=tick;const state=declaration.snapshot();status.textContent=`${tick}T · ${state.phase} · P${state.player}`}
async function restart(){const request=++serial;playing=false;declaration.reset();status.textContent='Loading…';const players=[p1.value,p2.value];await declaration.prepare(players);if(request!==serial)return;variants=undefined;declaration.begin(players,options());variants=declaration.snapshot().variants;tick=0;accumulator=0;last=undefined;playing=true;play.textContent='Pause';draw()}
function seek(value){if(!variants)return;playing=false;seeking=true;declaration.reset();declaration.begin([p1.value,p2.value],options());tick=0;while(tick<value&&declaration.active()){declaration.step();tick++}seeking=false;play.textContent='Play';accumulator=0;draw()}
for(const control of [p1,p2,mode,winner])control.onchange=()=>restart().catch(fail);document.querySelector('#replay').onclick=()=>restart().catch(fail);play.onclick=()=>{playing=!playing;last=undefined;play.textContent=playing?'Pause':'Play'};slider.oninput=()=>seek(Number(slider.value));
function fail(error){playing=false;status.textContent=error.message;console.error(error)}
function frame(now){if(playing&&last!==undefined){accumulator+=Math.min(.05,(now-last)/1000)*60;while(accumulator>=1&&declaration.active()){accumulator--;declaration.step();tick++}}last=now;draw();requestAnimationFrame(frame)}
window.declarationReview={declaration,seek,restart,canvas,get tick(){return tick}};await restart();requestAnimationFrame(frame);
</script></html>
