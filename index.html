<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prototype 0.6 Venus + StageTraining</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050d;font-family:system-ui;color:#fff}#app,canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#venus{pointer-events:none}#hud{position:fixed;z-index:5;left:12px;top:12px;background:#08080dbb;padding:11px 14px;border-radius:14px}#ctrl{position:fixed;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{font-size:15px;padding:12px 14px;border-radius:16px;border:1px solid #ffffff55;background:#09090dcc;color:white}#rotate{display:none;position:fixed;z-index:20;inset:0;background:#05050df2;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:700;padding:30px}
@media (orientation:portrait){#rotate{display:flex}#hud,#ctrl{display:none}}
#detail{font-size:13px;opacity:.8;margin-top:3px}#pbar{height:6px;background:#ffffff22;border-radius:8px;overflow:hidden;margin-top:7px;width:260px}#pfill{height:100%;width:0;background:white;transition:width .15s}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body><div id="rotate">請將手機打橫 ↻<br><small style="font-size:14px;font-weight:400">Prototype 0.6 uses a 1280 × 720 battle viewport</small></div><div id="app"></div><canvas id="venus"></canvas><div id="hud"><b>Prototype 0.6 · Venus</b><div id="status">Downloading StageTraining.glb…</div><div id="detail">0 / ? MB</div><div id="pbar"><div id="pfill"></div></div><div id="act">Action 0 · Idle</div></div>
<div id="ctrl"><button data-a="21">◀ Walk</button><button data-a="0">Idle</button><button data-a="20">Walk ▶</button><button data-a="11">Crouch</button><button data-a="41">Jump</button></div>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const app=document.querySelector('#app'), status=document.querySelector('#status'), act=document.querySelector('#act');
const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x05050d);const c=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.01,500);c.position.set(0,5.1,20.5);c.lookAt(0,2.2,-3.8);
s.add(new THREE.HemisphereLight(0xffffff,0x303040,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(4,8,5);s.add(sun);
let mix;
const detail=document.querySelector('#detail'),pfill=document.querySelector('#pfill');
new GLTFLoader().load('./StageTraining.glb',
g=>{
 status.textContent='Parsing / preparing GPU…';pfill.style.width='100%';
 g.scene.scale.setScalar(.075);g.scene.position.set(0,-.2,-.9);s.add(g.scene);
 if(g.animations.length){mix=new THREE.AnimationMixer(g.scene);g.animations.forEach(a=>mix.clipAction(a).play())}
 status.textContent='READY · camera locked';detail.textContent='Stage loaded · FOV 30 · model scale 0.075';
},
xhr=>{
 if(xhr.lengthComputable){
   const p=Math.min(99,xhr.loaded/xhr.total*100);
   status.textContent='Downloading StageTraining.glb… '+p.toFixed(1)+'%';
   detail.textContent=(xhr.loaded/1048576).toFixed(1)+' / '+(xhr.total/1048576).toFixed(1)+' MB';
   pfill.style.width=p+'%';
 }else{
   status.textContent='Downloading StageTraining.glb…';
   detail.textContent=(xhr.loaded/1048576).toFixed(1)+' MB received';
   pfill.style.width='5%';
 }
},
e=>{status.textContent='Stage ERROR';detail.textContent=String(e?.message||e)}
);
const cv=document.querySelector('#venus'),ctx=cv.getContext('2d');let atlas,dat,current=0,fi=0,ticks=0,last=performance.now();
Promise.all([new Promise((ok,err)=>{atlas=new Image();atlas.onload=ok;atlas.onerror=err;atlas.src='./venus_atlas.png'}),fetch('./venus_anim.json').then(x=>x.json())]).then(x=>{dat=x[1];});
function setAction(a){current=+a;fi=0;ticks=0;act.textContent='Action '+a+({0:' · Idle',20:' · Walk right',21:' · Walk left',11:' · Crouch',41:' · Jump'}[a]||'')}
document.querySelectorAll('button').forEach(b=>{b.onclick=()=>setAction(b.dataset.a)});
function draw(dt){ctx.clearRect(0,0,cv.width,cv.height);if(!dat||!atlas)return;let frames=dat.actions[current]||dat.actions[0];if(!frames.length)return;let f=frames[fi];let key=f.group+','+f.item,sp=dat.sprites[key];if(!sp)return;
 ticks+=dt*60;let dur=f.time<0?1e9:Math.max(1,f.time);if(ticks>=dur){ticks=0;fi=(fi+1)%frames.length;f=frames[fi];key=f.group+','+f.item;sp=dat.sprites[key]||sp}
 const fit=Math.min(innerWidth/1280,innerHeight/720);
 const viewW=1280*fit, viewH=720*fit;
 const viewX=(innerWidth-viewW)*0.5, viewY=(innerHeight-viewH)*0.5;
 const scale=fit; // SFF localcoord 1280x720 => 1:1 game-coordinate baseline
 const ground=viewY+660*fit; // StageInfo zoffset = 660
 const px=viewX+640*fit;
 const dx=px-(sp.axisX-f.ox)*scale,dy=ground-(sp.axisY-f.oy)*scale;
 ctx.imageSmoothingEnabled=true;ctx.drawImage(atlas,sp.x,sp.y,sp.w,sp.h,dx,dy,sp.w*scale,sp.h*scale);
}
const clock=new THREE.Clock();function loop(now){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(mix)mix.update(dt);r.render(s,c);draw(dt)}requestAnimationFrame(loop);
function resize(){
 const targetAspect=1280/720, screenAspect=innerWidth/innerHeight;
 let rw=innerWidth,rh=innerHeight;
 if(screenAspect>targetAspect){rh=innerHeight;rw=rh*targetAspect}
 else{rw=innerWidth;rh=rw/targetAspect}
 r.setSize(rw,rh,false);
 r.domElement.style.width=rw+'px';r.domElement.style.height=rh+'px';
 r.domElement.style.left=((innerWidth-rw)/2)+'px';r.domElement.style.top=((innerHeight-rh)/2)+'px';
 c.aspect=targetAspect;c.updateProjectionMatrix();
 cv.width=Math.round(innerWidth*devicePixelRatio);cv.height=Math.round(innerHeight*devicePixelRatio);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
</script></body></html>
