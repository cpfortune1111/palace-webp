 if(p2.state===5001)p2.vx*=constVal('movement.stand.friction');

let collisionContact=false;
function worldBoxes(localBoxes,x,y,facing=1){
 return localBoxes.map(b=>{const ax=x+(facing>=0?b[0]:-b[2]),bx=x+(facing>=0?b[2]:-b[0]),ay=y+b[1],by=y+b[3];return {l:Math.min(ax,bx),r:Math.max(ax,bx),t:Math.min(ay,by),b:Math.max(ay,by)}})
}
function rectOverlap(a,b){return a.l<=b.r&&a.r>=b.l&&a.t<=b.b&&a.b>=b.t}
function resolveCollisionM1(frame){

 const atk=worldBoxes(set?.c1||[],frame.x,frame.y,p1Facing);

 const overlap=atk.some(a=>body.some(b=>rectOverlap(a,b)));
 return {overlap,contact:overlap};
}

// Fighter Interaction M1. Source basis: IKEMEN pushDetection uses Size boxes,
// Clsn2 overlap, equal-priority/weight push factors, then xScreenBound; auto-turn
// is suppressed by noAutoTurn. This Venus-vs-Venus slice uses Venus [Size]

const VENUS_GROUND_BACK=40,VENUS_GROUND_FRONT=40;
function clampFighterScreenM1(){
 const left=Math.max(STAGE_PLAYER.leftbound,cameraX-640+STAGE_PLAYER.screenleft);
 const right=Math.min(STAGE_PLAYER.rightbound,cameraX+640-STAGE_PLAYER.screenright);
 posX=Math.max(left,Math.min(right,posX));
 p2.x=Math.max(left,Math.min(right,p2.x));
}
function playerPushM1(){
 // Ground Size boxes: Venus source ground.back/front = 40. Equal Venus weight/priority
 // means split penetration evenly, matching IKEMEN's equal-factor branch.
 if(posY!==0||p2.y!==0)return;
 const p1L=posX-VENUS_GROUND_BACK,p1R=posX+VENUS_GROUND_FRONT;
 const p2L=p2.x-VENUS_GROUND_BACK,p2R=p2.x+VENUS_GROUND_FRONT;
 const overlap=Math.min(p1R,p2R)-Math.max(p1L,p2L);if(overlap<=0)return;
 const half=overlap*.5;
 if(posX<p2.x){posX-=half;p2.x+=half}
 else if(posX>p2.x){posX+=half;p2.x-=half}
 else {posX-=half;p2.x+=half}
 clampFighterScreenM1();
 // Corner compensation: if screen clamp prevented one half, move the other fighter
 // by the remaining penetration, as IKEMEN does for equal push priority.
 const l=posX-VENUS_GROUND_BACK,r=posX+VENUS_GROUND_FRONT,
       l2=p2.x-VENUS_GROUND_BACK,r2=p2.x+VENUS_GROUND_FRONT;
 const rem=Math.min(r,r2)-Math.max(l,l2);
 if(rem>0){if(posX<=p2.x){p2.x+=rem}else{p2.x-=rem};clampFighterScreenM1()}
}
function setP1Facing(facing){if(p1Facing!==facing){p1Facing=facing;vx=-vx}}
function turnElement(anim,time){

 for(let index=0;index<frames.length;index++){elapsed+=Math.max(1,frames[index].time);if(time<elapsed)return index}

}
function advanceTurnAnimations(){

  if(state===0&&current===5&&animDone()){current=0;fi=0;ticks=0}
 }

  p2TurnTime++;

}
function autoTurnM1(){

  const anim=def?.type==='C'?6:5;
  if(current!==anim){current=anim;fi=0;ticks=0;p1TurnTime=0}
  setP1Facing(desired);
 }
 if(p2.ctrl&&(p2.state===0||p2.state===11||p2.state===20)&&p2.type!=='A'&&p2.facing!==-desired){
  const anim=p2.type==='C'?6:5;

}
function simStep(){

 if(p1HitPause>0){sampleInputHistory();p1HitPause--;if(p2.hitShake>0)p2.hitShake--;return}

 // Freeze ONE authoritative logical-frame snapshot after controller evaluation.
 // HitDef, collision resolution, Step rendering and HUD all consume this same frame.
 {
   const ld=stateDef();
   const frame={state,time:stateTicks,anim:current,elem:fi+1,ctrl:runtimeCtrl,
     physics:ld?.physics||'',type:ld?.type||'',moveType:runtimeMoveType,
     x:posX,y:posY,hitDef:activeHitDef?{...activeHitDef}:null};

 }

 // First apply the actual StageTraining player world bounds, not the old prototype ±580 clamp.
 posX=Math.max(STAGE_PLAYER.leftbound,Math.min(STAGE_PLAYER.rightbound,posX));

 clampFighterScreenM1();
}

 boxes(set.c2,'rgba(70,150,255,.95)','rgba(70,150,255,.18)');

 for(const b of VENUS_ACTION0_CLSN2){const x1=marsAxisX-b[2]*fit,x2=marsAxisX-b[0]*fit,y1=marsAxisY+b[1]*fit,y2=marsAxisY+b[3]*fit;colctx.fillRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));colctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1))}
}

let simulationAccumulator=0;
function advanceSimulation(dt){
 simulationAccumulator+=dt;
 while(simulationAccumulator+1e-9>=1/60){if(mix)mix.update(1/60);simStep();simulationAccumulator=Math.max(0,simulationAccumulator-1/60)}
}
